@if (envioMasivo) {
<form name="deleteForm" (ngSubmit)="confirmDelete(envioMasivo.id!)">
    <div class="modal-header">
        <h4 class="modal-title" data-cy="envioMasivoDeleteDialogHeading" jhiTranslate="entity.delete.title">
            Confirmar operación de borrado
        </h4>
    </div>

    <div class="modal-body">
        <jhi-alert-error />
        <p
            id="jhi-delete-envioMasivo-heading"
            jhiTranslate="booksApp.envioMasivo.delete.question"
            [translateValues]="{ id: envioMasivo.id }"
        >
            ¿Seguro que quiere eliminar Envio Masivo {{ envioMasivo.id }}?
        </p>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
            <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Cancelar</span>
        </button>

        <button id="jhi-confirm-delete-envioMasivo" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
            <fa-icon icon="times" />&nbsp;<span jhiTranslate="entity.action.delete">Eliminar</span>
        </button>
    </div>
</form>
}
